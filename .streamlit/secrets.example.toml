# Exemplo sem credenciais. Copie para Secrets do app de TESTE e substitua os campos.
[auth]
redirect_uri = "https://SEU-APP-DE-TESTE.streamlit.app/oauth2callback"
cookie_secret = "SUBSTITUA_POR_UM_SEGREDO_ALEATORIO_FORTE"
expose_tokens = ["access"]

[auth.google]
client_id = "SEU_CLIENT_ID.apps.googleusercontent.com"
client_secret = "SEU_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { scope = "openid profile email https://www.googleapis.com/auth/spreadsheets.readonly", prompt = "select_account consent" }
